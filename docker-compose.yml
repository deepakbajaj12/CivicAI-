version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: civicai-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: civicai
    volumes:
      - mongodb_data:/data/db
    networks:
      - civicai-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: civicai-backend
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/civicai
      - FLASK_ENV=production
      - PORT=5000
    env_file:
      - ./backend/.env
    depends_on:
      - mongodb
    networks:
      - civicai-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: civicai-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - civicai-network

volumes:
  mongodb_data:

networks:
  civicai-network:
    driver: bridge
